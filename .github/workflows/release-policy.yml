# SPDX-License-Identifier: GPL-3.0-or-later
name: JAGLINK Release Policy
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  release-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Enforce qualification and publication ownership
        shell: bash
        run: |
          set -euo pipefail
          ci=.github/workflows/ci.yml
          release=.github/workflows/release.yml
          test ! -e .github/workflows/auto-release.yml
          ! grep -Fq 'head_commit.message' "$ci" "$release"
          ! grep -Fq 'contents: write' "$ci"
          grep -Fq 'workflows: ["JAGLINK CI"]' "$release"
          grep -Fq 'github.event.workflow_run.id' "$release"
          if grep -Eq 'cmake --build|xcodebuild |cpack --config' "$release"; then
            echo 'Publication must consume qualified artifacts without rebuilding.' >&2
            exit 1
          fi
